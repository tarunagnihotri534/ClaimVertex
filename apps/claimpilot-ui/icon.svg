<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cpBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cpShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cpGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cpWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="26" fill="url(#cpBaseGrad)" />
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Shield Outer Geometry -->
  <path d="M60 18 L92 32 V62 C92 84 60 102 60 102 C60 102 28 84 28 62 V32 Z" 
        fill="url(#cpShieldGrad)" 
        fill-opacity="0.12" 
        stroke="url(#cpShieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Inner Dynamic Wings (Aerodynamic Pilot Chevron) -->
  <path d="M60 30 L82 54 L68 54 L60 42 L52 54 L38 54 Z" 
        fill="url(#cpWingGrad)" />

  <path d="M60 48 L76 68 L64 68 L60 60 L56 68 L44 68 Z" 
        fill="url(#cpShieldGrad)" />

  <!-- Pilot Compass / Radar Beacon Center Core -->
  <polygon points="60,62 67,76 60,90 53,76" fill="url(#cpGoldGrad)" filter="url(#cpGlow)" />
  <circle cx="60" cy="76" r="3.5" fill="#ffffff" />

  <!-- Speed Arc Accents -->
  <path d="M42 40 C34 48 32 58 32 66" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" />
  <path d="M78 40 C86 48 88 58 88 66" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" />
</svg>
